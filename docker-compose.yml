services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: r3a
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: r3a_ai
    volumes:
      - r3a_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r3a -d r3a_ai"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://r3a:${POSTGRES_PASSWORD}@db:5432/r3a_ai?schema=public
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a unique ADMIN_PASSWORD in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      PAYMENT_PROVIDER_LABEL: ${PAYMENT_PROVIDER_LABEL:-اتصالات كاش}
      PAYMENT_MODE: ${PAYMENT_MODE:-manual}
      PAYMENT_WALLET_PHONE: ${PAYMENT_WALLET_PHONE:-01114887511}
    ports:
      - "3000:3000"
volumes:
  r3a_db:
